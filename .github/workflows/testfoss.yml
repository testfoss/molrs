name: testfoss

on:
  push:
    branches: [testfoss-demo]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testfoss-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  rust-wasm-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/testfoss-molrs-target
    steps:
      - name: Check out the additive fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install wasm-pack 0.15.0
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack@0.15.0
      - name: Install Binaryen version_133
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz" \
            | sudo tar -xz -C /usr/local --strip-components=1
          rustup show active-toolchain
          wasm-pack --version
          wasm-opt --version
      - name: Run upstream Rust tests
        run: cargo mrs-test --locked
      - name: Run upstream Wasm tests
        working-directory: molrs-wasm
        run: wasm-pack test --node -- --locked
      - name: Generate source-built browser package
        working-directory: molrs-wasm
        run: wasm-pack build --release --target web --out-dir ../testfoss/pkg --out-name molrs -- --locked
      - name: Install browser-test tools
        run: |
          npm install --global @lmctl-ai/lmctl@0.2.426
          lmscript install github:lmctl-ai/lmwebtest@v0.1.10
          echo "$HOME/.cache/lmscript/tools/github/lmctl-ai/lmwebtest/v0.1.10" >> "$GITHUB_PATH"
          npm ci --prefix testfoss
          npm run --prefix testfoss browsers:install
      - name: Check additive JavaScript syntax
        run: |
          node --check testfoss/app.js
          node --check testfoss/fixtures.js
      - name: Run UFF and L-BFGS through lmwebtest
        env:
          TESTFOSS_URL: http://127.0.0.1:8000
        run: |
          python3 testfoss/server.py --root . --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          lmwebtest --version
          export TESTFOSS_CHROMIUM="$(node --input-type=module -e "import { chromium } from './testfoss/node_modules/playwright/index.mjs'; console.log(chromium.executablePath())")"
          lmscript testfoss/browser.lms
